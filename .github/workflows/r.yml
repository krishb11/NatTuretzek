name: R-CMD-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ['4.2']

    steps:
      - uses: actions/checkout@v4

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libgit2-dev \
            libicu-dev

      - name: Install CRAN dependencies
        run: |
          install.packages(c(
            'rcmdcheck', 'remotes', 'dplyr', 'scales',
            'readr', 'rlist', 'ggplot2', 'BiocManager'
          ), repos = 'https://cloud.r-project.org')
        shell: Rscript {0}

      - name: Install sleuth from r-universe
        run: |
          install.packages(
            'sleuth',
            repos = c('https://pachterlab.r-universe.dev', 'https://cloud.r-project.org')
          )
        shell: Rscript {0}

      - name: Install required Bioconductor packages (minimal direct set)
        run: |
          options(repos = BiocManager::repositories())
          BiocManager::install(
            c('Biostrings', 'biomaRt', 'HTSFilter', 'HTSCluster'),
            ask = FALSE,
            update = FALSE,
            dependencies = TRUE
          )
        shell: Rscript {0}

      - name: Check
        run: rcmdcheck::rcmdcheck(args = c('--no-manual', '--as-cran'), error_on = 'error')
        shell: Rscript {0}
