name: R-CMD-check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        r-version: ['4.1', '4.2']

    steps:
      - uses: actions/checkout@v4

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - name: Set up pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Install CRAN dependencies
        run: |
          install.packages(c(
            'rcmdcheck', 'remotes', 'dplyr', 'scales',
            'readr', 'rlist', 'ggplot2'
          ), repos = 'https://cloud.r-project.org')
        shell: Rscript {0}

      - name: Install Bioconductor dependencies
        run: |
          if (!requireNamespace('BiocManager', quietly = TRUE)) {
            install.packages('BiocManager', repos = 'https://cloud.r-project.org')
          }
          BiocManager::install(
            c('Biostrings', 'HTSFilter', 'HTSCluster', 'biomaRt', 'sleuth'),
            ask = FALSE,
            update = FALSE
          )
          if (!requireNamespace('sleuth', quietly = TRUE)) {
            remotes::install_github('pachterlab/sleuth')
          }
        shell: Rscript {0}

      - name: Check
        run: rcmdcheck::rcmdcheck(args = c('--no-manual', '--as-cran'), error_on = 'error')
        shell: Rscript {0}
